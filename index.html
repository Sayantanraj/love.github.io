<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: 3em;
      color: #fff;
      margin-top: 50px;
      text-shadow: 2px 2px 4px #00000050;
    }

    h2 {
      color: #fff;
      margin: 20px;
      font-size: 2em;
    }

    .balloon {
      position: absolute;
      bottom: -150px;
      width: 80px;
      height: 100px;
      background: radial-gradient(circle at 30% 30%, #ff6f91, #ff165d);
      border-radius: 50% 50% 50% 50%;
      animation: float 6s infinite ease-in;
    }
    .balloon:before {
      content: "";
      position: absolute;
      width: 2px;
      height: 60px;
      background: #444;
      top: 100px;
      left: 50%;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-300px); }
      100% { transform: translateY(0); }
    }

    .cake {
      margin: 50px auto;
      width: 200px;
      height: 150px;
      background: #ff6f61;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .cake:before {
      content: "";
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 30px;
      background: #fff;
      border-radius: 5px;
    }

    .candle {
      width: 10px;
      height: 40px;
      background: #fff;
      margin: auto;
      position: relative;
      top: -40px;
      border-radius: 3px;
    }

    .flame {
      width: 15px;
      height: 15px;
      background: orange;
      border-radius: 50%;
      position: absolute;
      top: -15px;
      left: -2px;
      animation: flicker 0.3s infinite;
    }

    @keyframes flicker {
      0% { transform: scale(1); background: orange; }
      50% { transform: scale(1.2); background: yellow; }
      100% { transform: scale(1); background: orange; }
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: yellow;
      top: -10px;
      animation: fall 4s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }

    .message {
      font-size: 1.5em;
      color: #fff;
      margin-top: 20px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      text-shadow: 1px 1px 3px #00000060;
    }

    .gallery {
      margin: 40px auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .gallery img {
      width: 200px;
      height: 150px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.1);
    }

    .proposal-btn {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 25px;
      background: #ff165d;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: 0.3s;
    }
    .proposal-btn:hover {
      background: #ff6f91;
      transform: scale(1.05);
    }

    /* Love card */
    .love-card {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #fff;
      text-align: center;
      flex-direction: column;
    }
    .love-card h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }
    .love-card p {
      font-size: 1.5em;
      max-width: 600px;
    }
    .back-btn {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 1em;
      border: none;
      border-radius: 20px;
      background: #ff165d;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    .back-btn:hover {
      background: #ff6f91;
    }
  </style>
</head>
<body>
  <audio autoplay loop>
    <source src="8.mp3" type="audio/mpeg"> 
  </audio>

  <h1>🎉 Happy Birthday My Love Tanushree (Choco) ❤️🧿🎉</h1>
  <h2>You are my everything 💕</h2>

  <div class="cake">
    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>

  <div class="message">
    On this special day, I just want to say... 💖<br>
    You are the most beautiful part of my life 🌹<br>
    Every moment with you feels magical ✨<br>
    I love you forever, Happy Birthday my sweetheart! 🎂💕
  </div>
  
  
  <div class="gallery">
    <img src="2.jpeg" alt="Memory 1">
    <img src="5.jpeg" alt="Memory 2">
    <img src="4.jpeg" alt="Memory 3">
     <img src="7.jpeg" alt="Memory 3">
  </div>
   <button class="proposal-btn" ><a href="video.html" target="_blank" style="text-decoration: none; color: #fff;">Video</a></button>
  <button class="proposal-btn" onclick="openLoveCard()">💌 Open Your Love Card</button>


  <div class="balloon" style="left:10%; animation-delay:0s;"></div>
  <div class="balloon" style="left:30%; animation-delay:2s; background: radial-gradient(circle at 30% 30%, #6a11cb, #2575fc);"></div>
  <div class="balloon" style="left:50%; animation-delay:4s; background: radial-gradient(circle at 30% 30%, #ff9a9e, #ff165d);"></div>
  <div class="balloon" style="left:70%; animation-delay:1s; background: radial-gradient(circle at 30% 30%, #43e97b, #38f9d7);"></div>
  <div class="balloon" style="left:90%; animation-delay:3s; background: radial-gradient(circle at 30% 30%, #f7971e, #ffd200);"></div>

  <script>
    for (let i = 0; i < 50; i++) {
      let confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.background = ['#ff165d','#ff6f91','#ff9a9e','#f9ed69','#f08a5d','#b83b5e'][Math.floor(Math.random()*6)];
      confetti.style.animationDuration = (2 + Math.random()*3) + 's';
      document.body.appendChild(confetti);
    }

    function openLoveCard(){
      document.body.innerHTML = `
        <div class='love-card'>
          <h1>💖 Will You Be Mine Forever Choco? 💖</h1>
          <p>From the moment I met you at Serampore Station, I knew you were my destiny. Choco, you are my heart, my soul, my everything. On your special day, I want to ask... will you walk this journey of life with me, forever? 💍❤️<br>
            I always want to hold your hand in each and every situation of you and I also want to be your Husband💍❤️</p>
          <button class='back-btn' onclick='location.reload()'>⬅ Back to the page</button>
        </div>
      `;
    }
  </script>
</body>
</html>
